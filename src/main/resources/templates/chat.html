<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🚀 Real-Time Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- STOMP + SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body {
          background: linear-gradient(to right, #e3f2fd, #ffffff);
          font-family: 'Segoe UI', sans-serif;
        }
        #chat {
          background-color: #f8f9fa;
          height: 350px;
          overflow-y: auto;
          border: 2px solid #0d6efd;
          box-shadow: 0 0 10px rgba(13, 110, 253, 0.2);
        }
        .chat-box {
          padding: 10px;
          border-radius: 8px;
          margin-bottom: 10px;
        }
        .user-message {
          background-color: #d1e7dd;
        }
        .chat-header {
          font-weight: bold;
          color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center chat-header mb-4">💬 Real-Time Chat Application</h1>

    <div id="chat" class="d-flex flex-column p-3 rounded mb-3"></div>

    <div class="row">
        <div class="col-md-4 mb-2">
            <input id="senderInput" type="text" class="form-control" placeholder="Enter your name...">
        </div>
        <div class="col-md-8 d-flex">
            <input id="messageInput" type="text" class="form-control me-2" placeholder="Type a message...">
            <button id="sendMessage" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>

<script>
    let stompClient = null;

    function connect() {
      const socket = new SockJS('http://localhost:8080/chat');  // full URL
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log("✅ Connected: ", frame);

        stompClient.subscribe('/topic/messages', function (message) {
          console.log("📥 Received:", message.body);
          showMessage(JSON.parse(message.body));
        });
      }, function (error) {
        console.error("❌ STOMP error:", error);
      });
    }

    function sendMessage() {
      const sender = document.getElementById('senderInput').value.trim();
      const content = document.getElementById('messageInput').value.trim();

      if (!sender || !content) return;

      const chatMessage = {
        sender: sender,
        content: content
      };

      stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
      document.getElementById('messageInput').value = '';
    }

    function showMessage(message) {
      const chat = document.getElementById('chat');
      const messageElement = document.createElement('div');
      messageElement.textContent = `${message.sender}: ${message.content}`;
      messageElement.className = "chat-box user-message";
      chat.appendChild(messageElement);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('sendMessage').addEventListener('click', sendMessage);
    window.addEventListener('load', connect);
</script>

</body>
</html>
